<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Arrows Compiler</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
        <script type="module" src="index.js"></script>
        <link rel="stylesheet" href="index.css">
        <link rel="icon" href="favicon.ico">
    </head>
    <body>
        <div id="source"></div>
        <div id="output-panel">
            <div id="output-header">
                <div class="toolbar-group">
                    <label for="output-format">Output:</label>
                    <select id="output-format">
                        <option value="arrows">Arrows Diskette</option>
                        <option value="hex">HEX Binary</option>
                    </select>
                </div>
                <div class="toolbar-group">
                    <label for="editor-mode">Editor:</label>
                    <select id="editor-mode">
                        <option value="monaco">Advanced</option>
                        <option value="plain">Simple</option>
                    </select>
                </div>
                <button id="copy">Copy</button>
            </div>
            <textarea id="output" readonly></textarea>
        </div>
    </body>
</html>
